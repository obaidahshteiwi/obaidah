name: Syria Mubasher - RSS and Website
# Collect and publish news every five minutes. A single scheduled workflow avoids duplicate dispatch loops.
# Manual publication updates to the site also trigger a fresh Pages deployment.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/news.json"
      - "data/state.json"
      - "images/**"
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      continue_loop:
        description: "Internal switch used by the automatic update loop"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

# Serialize runs instead of cancelling an active run. This prevents concurrent
# runs from racing to push data/news.json and data/state.json to main.
concurrency:
  group: "syria-mubasher-pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile scripts/update_news.py

      - name: Install image processing library
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Fetch RSS news and post to WhatsApp when configured
        env:
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_news.py

      - name: Commit updated news data
        id: data_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/news.json data/state.json images/news)" ]]; then
            git add data/news.json data/state.json images/news
            git commit -m "Update Syria news feed"

            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Could not rebase generated news data onto the latest main branch."
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed; refreshing main and retrying."
              sleep 3
            done

            if [[ "$pushed" != "true" ]]; then
              echo "Could not publish generated news data after three attempts."
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # A newer code change may arrive while RSS enrichment is running. Deploy
      # the current main branch, not an older checkout from the start of this job.
      - name: Refresh files before deployment
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

