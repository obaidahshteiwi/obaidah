name: Syria Mubasher - RSS and Website
# Scheduled every five minutes; this harmless workflow update triggers an immediate run.
# Manual publication updates to the site should trigger a fresh Pages deployment.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/news.json"
      - "data/state.json"
      - "images/**"
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize runs instead of cancelling an active run. This prevents concurrent
# runs from racing to push data/news.json and data/state.json to main.
concurrency:
  group: "syria-mubasher-pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile scripts/update_news.py

      - name: Install image processing library
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Fetch RSS news and post to WhatsApp when configured
        env:
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}
        run: python scripts/update_news.py

      - name: Commit updated news data
        id: data_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/news.json data/state.json images/news)" ]]; then
            git add data/news.json data/state.json images/news
            git commit -m "Update Syria news feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
