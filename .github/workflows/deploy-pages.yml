name: Syria Mubasher - RSS and Website
# Scheduled every five minutes, offset from the top of the hour. An auto-dispatch loop is a fallback.
# Manual publication updates to the site should trigger a fresh Pages deployment.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/news.json"
      - "data/state.json"
      - "images/**"
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      continue_loop:
        description: "Internal switch used by the automatic update loop"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

# Serialize runs instead of cancelling an active run. This prevents concurrent
# runs from racing to push data/news.json and data/state.json to main.
concurrency:
  group: "syria-mubasher-pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile scripts/update_news.py

      - name: Install image processing library
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Fetch RSS news and post to WhatsApp when configured
        env:
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}
        run: python scripts/update_news.py

      - name: Commit updated news data
        id: data_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/news.json data/state.json images/news)" ]]; then
            git add data/news.json data/state.json images/news
            git commit -m "Update Syria news feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Start a self-recovering five-minute cycle only when the workflow file
      # itself is changed, or when the previous cycle explicitly dispatches it.
      # Ordinary scheduled runs do not create extra loops.
      - name: Continue automatic update loop
        if: always() && ((github.event_name == 'push' && contains(github.event.head_commit.modified, '.github/workflows/deploy-pages.yml')) || (github.event_name == 'workflow_dispatch' && inputs.continue_loop))
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The news/deploy work usually takes about two minutes; this delay
          # makes the next cycle start about every five minutes.
          sleep 160
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/deploy-pages.yml/dispatches"
          payload = json.dumps({"ref": "main", "inputs": {"continue_loop": True}}).encode("utf-8")

          for attempt in range(1, 4):
              request = urllib.request.Request(
                  url,
                  data=payload,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if response.status == 204:
                          print("Next automatic update cycle dispatched.")
                          break
                      print(f"GitHub returned unexpected HTTP status {response.status}.")
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                  print(f"Dispatch attempt {attempt}/3 failed: {type(exc).__name__}: {exc}")
              if attempt < 3:
                  time.sleep(10)
          else:
              print("Could not dispatch the next cycle after three attempts.")
              sys.exit(1)
          PY
